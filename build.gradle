plugins {
    id 'com.android.application' version '8.5.2'
}

import javax.imageio.ImageIO
import java.awt.RenderingHints
import java.awt.image.BufferedImage

// The GitHub browser upload used for this project flattens folders.
// These tasks reconstruct the normal Android source/resource layout at build time.
def flatJavaDir = file("$projectDir/.flat-java")
def flatResDir = file("$projectDir/.flat-res")

tasks.register('prepareFlatJava', Sync) {
    from('MainActivity.java')
    into(flatJavaDir)
}

def scalePng = { File input, File output, int size ->
    BufferedImage source = ImageIO.read(input)
    BufferedImage target = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
    def graphics = target.createGraphics()
    graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
    graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
    graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
    graphics.drawImage(source, 0, 0, size, size, null)
    graphics.dispose()
    output.parentFile.mkdirs()
    ImageIO.write(target, 'png', output)
}

tasks.register('prepareFlatResources') {
    inputs.files('app_icon.png', 'app_icon_foreground.png')
    outputs.dir(flatResDir)
    doLast {
        delete flatResDir
        flatResDir.mkdirs()

        def legacySizes = [mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192]
        def adaptiveSizes = [mdpi:108, hdpi:162, xhdpi:216, xxhdpi:324, xxxhdpi:432]
        legacySizes.each { bucket, px ->
            scalePng(file('app_icon.png'), file("$flatResDir/mipmap-${bucket}/ic_launcher.png"), px as int)
        }
        adaptiveSizes.each { bucket, px ->
            scalePng(file('app_icon_foreground.png'), file("$flatResDir/mipmap-${bucket}/ic_launcher_foreground.png"), px as int)
        }

        file("$flatResDir/values").mkdirs()
        file("$flatResDir/values/colors.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#07101D</color>
</resources>
'''
        file("$flatResDir/values/styles.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.FlipRush7" parent="android:style/Theme.DeviceDefault.NoActionBar">
        <item name="android:windowBackground">#07101D</item>
        <item name="android:statusBarColor">#07101D</item>
        <item name="android:navigationBarColor">#050A12</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:colorAccent">#32E5CB</item>
    </style>
</resources>
'''
        file("$flatResDir/mipmap-anydpi-v26").mkdirs()
        file("$flatResDir/mipmap-anydpi-v26/ic_launcher.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@mipmap/ic_launcher_foreground" />
</adaptive-icon>
'''
    }
}

def signingPath = System.getenv('FR7_KEYSTORE_PATH')
def signingStorePassword = System.getenv('FR7_KEYSTORE_PASSWORD')
def signingAlias = System.getenv('FR7_KEY_ALIAS')
def signingKeyPassword = System.getenv('FR7_KEY_PASSWORD')
def hasReleaseSigning = signingPath && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'com.fliprush7.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fliprush7.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [flatJavaDir]
            res.srcDirs = [flatResDir]
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('prepareFlatJava')
    dependsOn tasks.named('prepareFlatResources')
}
