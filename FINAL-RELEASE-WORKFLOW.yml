name: Build Flip Rush 7 v1.1 Voice Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flip-rush-7-release-key.jks"

      - name: Build signed release APK
        env:
          FR7_KEYSTORE_PATH: ${{ runner.temp }}/flip-rush-7-release-key.jks
          FR7_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FR7_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FR7_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare final APK
        run: |
          APK=$(find build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Flip-Rush-7-v1.1.apk
          sha256sum Flip-Rush-7-v1.1.apk > Flip-Rush-7-v1.1.sha256.txt

      - name: Upload final app
        uses: actions/upload-artifact@v4
        with:
          name: Flip-Rush-7-v1.1-Voice-Release
          path: |
            Flip-Rush-7-v1.1.apk
            Flip-Rush-7-v1.1.sha256.txt
          if-no-files-found: error
